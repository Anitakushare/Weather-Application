<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forcast Application</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
        integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./output.css">

</head>

<body class="bg-gray-400">
     <!-- Header Section -->
    <header class="bg-blue-950 h-16">
        <h1 class="text-white text-center text-2xl md:text-4xl py-2 font-bold">Weather Dashboard</h1>
    </header>
    <main class="flex flex-col md:flex-col lg:flex-row items-strat  md:justify-center md:mx-auto gap-8 px-4 py-10">
        <section class="w-full max-w-lg md:max-w-4xl h-auto" id="services1">
            <div class="flex flex-col md:flex-row md:justify-center items-center md:mx-auto md:gap-6  text-white">
                <div
                    class=" bg-gray-900 md:w-[400px] px-5 py-8 rounded-lg border border-purple shadow-[#5dadec3b] shadow-lg  ">
                    <form id="search-form" class="flex flex-col justify-center gap-5" autocomplete="off">
                        <label class="text-white font-bold text-xl" for="city">Enter City Name:</label>
                        <input type="text" id="city" placeholder="Eg: Delhi,Paris,New York"
                            class="p-3 border rounded-lg focus:outline-none  bg-transparent" name="city">
                            <div id="error-message" class="hidden bg-red-200 text-red-800 p-4 rounded">
                                <!-- Error messages will appear here -->
                              </div>
                        <button id="btn1"
                            class="bg-blue-900 text-white py-3.5 px-3 rounded-lg hover:bg-blue-800 focus:outline-none ">
                            Search
                        </button>
                    </form>
                    <div class="inline-flex items-center justify-center w-full">
                        <hr class="w-80 h-px my-8 bg-gray-500 border-0 dark:bg-gray-700">
                        <span
                            class="absolute px-3 font-medium text-gray-900  bg-gray-200  dark:text-white dark:bg-gray-900">or</span>
                    </div <div class=" my-4"><button id="btn2"
                        class="rounded-lg bg-slate-700 py-1 px-2 border border-transparent text-center text-white transition-all shadow-sm hover:shadow-xl focus:bg-slate-600 focus:shadow-none active:bg-slate-600 hover:bg-slate-600 h-12 w-full"
                        type="button">
                        Use Current Location
                    </button>

                    <div id="recent-cities-container"
                        class=" hidden flex flex-col justify-center items-center gap-5 bg-transparent h-auto">
                        <label for="recent-cities"
                            class=" justify-center text-white font-bold text-lg mb-2 md:mb-0 mt-7">Recently Searched
                            Cities:</label>
                        <select id="recent-cities"
                            class="p-2 mb-2 md:mb-0 mt-7 md:mt-0 border rounded-md focus:outline-none  text-gray-200 bg-gray-900"><i
                                class="fa-regular fa-square-caret-down"></i>
                            <!-- Options -->
                        </select>
                    </div>

                </div>
            </div>

        </section>
        <section id="weather-section" class="w-full max-w-3xl flex flex-col gap-8 hidden">
            <!-- Current Weather Section -->
            <article id="weather" class=" bg-blue-950 w-full max-w-3xl rounded-lg border border-purple shadow-[#5dadec3b]  shadow-lg transition-shadow duration-300 hidden">
        
                    <div class="w-full  text-center py-4">
                        <h2 class="text-2xl font-bold text-white" id="cLocation"></h2> 
                        <p class="text-2xl font-bold text-white" id="date"></p>
                    </div>
                    <div class=" flex justify-center items-center gap-28">                       
                        <div class="text-center">
                            <img id="icon" alt="Weather Icon" class="w-18 h-16">
                            <p class="text-xl text-white"><i class="fa-solid fa-temperature-three-quarters"></i> <span id="temp" class="font-bold"></span></p>
                            <p id="desc" class="text-slate-300 mb-4"></p></div>
                    </div>
                    <div class="flex flex-col sm:flex-row justify-center sm:justify-between items-center gap-4 px-6 mb-2">
                       
                        <p class="text-lg text-white"><i class="fa-solid fa-wind"></i> Wind : <span
                                class="font-bold" id="wind"></span> m/s</p>
                        <p class="text-lg text-white"><i class="fa-solid fa-droplet"></i> Humidity : <span
                                class="font-bold" id="humidity"></span>%</p>
                    </div>

            </article>
            <article class="w-full max-w-3xl" id="services">
                <!--Forecast Section -->
                <div id="forecast-container"
                    class="w-full max-w-3xl bg-gray-900 p-6 rounded-lg border border-purple shadow-[#5dadec3b]  shadow-lg hidden ">
                    <h3 class="text-xl font-bold text-white mb-4">5-Day Forecast</h3>
                    <div id="forecast-cards" class="flex flex-col justify-center items-center gap-4">
                       
                            <!-- Error messages will appear here -->
                          </div>
                        <!-- Cards -->
                    </div>
                </div>
                </div>
            </article>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
