<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forcast Application</title>
    <link rel="stylesheet" href="./output.css">

</head>

<body class=" bg-blue-400">
    <header class="bg-blue-600 h-16 mb-12">
        <h1 class="text-white text-center text-4xl py-2 font-bold">Weather Dashboard</h1>
    </header>
    <main class="grid grid-cols-3 gap-24">
        <section
            class="w-full max-w-md rounded-md bg-blue-950 h-80 flex justify-center items-center m-4 shadow-xl shadow-blue-500/50">
            <form id="search" class="flex flex-col items-center justify-center w-full gap-5 ">
                <label for="city" class="flex text-gray-700 font-bold mb-2">Enter City Name:</label>
                <input type="text" id="city" placeholder="eg.Delhi,Mumbai,Lundon"
                    class="w-96 p-3 border rounded-md focus:outline-none focus:ring focus:ring-blue-300">
                <button id="btn1" type="submit"
                    class="bg-blue-600 text-white p-3 rounded-md hover:bg-blue-700 focus:outline-none w-96 ">
                    Search
                </button>

                <div class="flex items-center justify-center w-full">
                    <hr class="w-96 h-px my-4 bg-gray-600 border-0 dark:bg-gray-700">
                    <span
                        class="absolute px-3 font-medium text-gray-900 -translate-x-1/4 bg-slate-400 dark:text-white dark:bg-gray-900">or</span>
                </div>

                <button id="btn2" type="submit"
                    class="bg-gray-600 text-white p-3 rounded-md hover:bg-gray-700 focus:outline-none w-96 ">
                    Use Current Location
                </button>
            </form>
            
        </section>
        <!-- Current Weather Section -->
        <section id="weather"
            class="w-full max-w-md h-80 m-4 bg-blue-950 rounded-lg p-6 mb-6 shadow-xl shadow-blue-900/60">
            <div class="flex flex-col justify-center items-center bg-yellow-700">
            <h2 class="text-2xl font-bold text-white" id="cLocation"></h2>
            <p class="text-white" id="date"></p>
        </div>
            <div class="flex flex-col items-center justify-center mt-4 mb-8">
                <div>
                    <img id="icon" alt="Weather Icon" class="w-16 h-16">
                   
                </div>
                <div class="ml-4 flex flex-col items-center justify-center">
                    <span class="text-xl text-white"></span>
                    <p id="temp" class="text-3xl font-bold text-white"></p>
                    <p id="desc" class="text-white"></p>
                </div>
               
               
            </div>
            <div class="mt-10 flex justify-center items-center gap-10">
                <p class="text-xl text-white">Wind: <span class="font-bold" id="wind"></span> m/s</p>
                <p class="text-xl text-white">Humidity: <span class="font-bold" id="humidity"></span>%</p>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
